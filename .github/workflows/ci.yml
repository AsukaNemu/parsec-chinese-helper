name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test configuration persistence
        run: zsh test.sh
      - name: Build and verify app bundle
        run: zsh build.sh
